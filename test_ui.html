<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROMA Web Search API Console</title>
  <style>
    :root {
      color-scheme: light;
      --iaie-color-primary: #555AFF;
      --iaie-color-secondary: #8C55FF;
      --iaie-color-info: #3782FF;
      --iaie-color-success: #1EB478;
      --iaie-color-warning: #FFB400;
      --iaie-color-danger: #F02D2D;
      --iaie-color-primary-hover: #4E53EB;
      --iaie-color-primary-active: #474CD6;
      --iaie-color-success-soft: #E8F8F2;
      --iaie-color-warning-soft: #FFF8E6;
      --iaie-color-danger-soft: #FEEAEA;
      --iaie-color-info-soft: #EBF2FF;
      --iaie-text-1: rgba(10, 10, 40, 1);
      --iaie-text-2: rgba(10, 10, 40, 0.8);
      --iaie-text-3: rgba(10, 10, 40, 0.55);
      --iaie-text-4: rgba(10, 10, 40, 0.4);
      --iaie-bg-page: #F7F8FF;
      --iaie-bg-card: #FFFFFF;
      --iaie-bg-muted: #F5F7FC;
      --iaie-bg-primary-soft: #EEEEFF;
      --iaie-border-default: rgba(10, 10, 40, 0.1);
      --iaie-border-strong: rgba(10, 10, 40, 0.18);
      --iaie-shadow-sm: 0 4px 12px rgba(10, 10, 40, 0.06);
      --iaie-shadow-md: 0 8px 24px rgba(10, 10, 40, 0.08);
      --iaie-shadow-lg: 0 16px 40px rgba(10, 10, 40, 0.12);
      --code-bg: #101326;
      --code-text: #E7EAF8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(238, 238, 255, 0.72) 0, rgba(247, 248, 255, 0) 320px),
        var(--iaie-bg-page);
      color: var(--iaie-text-1);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--iaie-border-default);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
    }

    .wrap {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      min-width: 88px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--iaie-color-primary), var(--iaie-color-secondary));
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 0 14px;
      box-shadow: 0 10px 24px rgba(85, 90, 255, 0.22);
    }

    .eyebrow {
      margin-bottom: 2px;
      color: var(--iaie-color-primary);
      font-size: 12px;
      font-weight: 600;
      line-height: 20px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      color: var(--iaie-text-1);
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--iaie-text-3);
      font-size: 14px;
      line-height: 22px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    main {
      padding: 32px 0 48px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 408px) 1fr;
      gap: 24px;
      align-items: start;
    }

    section {
      background: var(--iaie-bg-card);
      border: 1px solid var(--iaie-border-default);
      border-radius: 16px;
      box-shadow: var(--iaie-shadow-sm);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--iaie-border-default);
      background: linear-gradient(180deg, #FFFFFF 0%, #FBFCFF 100%);
    }

    h2 {
      color: var(--iaie-text-1);
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }

    .panel-desc {
      margin-top: 4px;
      color: var(--iaie-text-3);
      font-size: 13px;
      line-height: 20px;
    }

    .panel-body {
      padding: 22px 24px 24px;
    }

    .field-group {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--iaie-text-2);
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
    }

    input,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--iaie-border-default);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--iaie-text-1);
      background: #fff;
      font: inherit;
      outline: none;
      transition: border-color 160ms cubic-bezier(0.2, 0, 0, 1), box-shadow 160ms cubic-bezier(0.2, 0, 0, 1);
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--iaie-text-4);
    }

    input:focus,
    textarea:focus {
      border-color: var(--iaie-color-primary);
      box-shadow: 0 0 0 3px rgba(85, 90, 255, 0.14);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--iaie-color-primary);
      border-radius: 8px;
      background: var(--iaie-color-primary);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: transform 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out, box-shadow 120ms ease-out;
    }

    button.secondary {
      background: #fff;
      color: var(--iaie-color-primary);
      border-color: rgba(85, 90, 255, 0.38);
    }

    button:hover {
      background: var(--iaie-color-primary-hover);
      border-color: var(--iaie-color-primary-hover);
      box-shadow: 0 8px 18px rgba(85, 90, 255, 0.18);
      transform: translateY(-1px);
    }

    button.secondary:hover {
      background: var(--iaie-bg-primary-soft);
      color: var(--iaie-color-primary-hover);
      box-shadow: none;
    }

    button:active {
      background: var(--iaie-color-primary-active);
      border-color: var(--iaie-color-primary-active);
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(85, 90, 255, 0.2);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
      transform: none;
      box-shadow: none;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border-radius: 999px;
      padding: 0 10px;
      border: 1px solid var(--iaie-border-default);
      background: #fff;
      color: var(--iaie-text-3);
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.55;
    }

    .badge.good {
      border-color: rgba(30, 180, 120, 0.24);
      background: var(--iaie-color-success-soft);
      color: var(--iaie-color-success);
    }

    .badge.warn {
      border-color: rgba(255, 180, 0, 0.34);
      background: var(--iaie-color-warning-soft);
      color: #A66F00;
    }

    .badge.bad {
      border-color: rgba(240, 45, 45, 0.22);
      background: var(--iaie-color-danger-soft);
      color: var(--iaie-color-danger);
    }

    .badge.info {
      border-color: rgba(55, 130, 255, 0.22);
      background: var(--iaie-color-info-soft);
      color: var(--iaie-color-info);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      min-height: 88px;
      border: 1px solid var(--iaie-border-default);
      border-radius: 12px;
      padding: 14px;
      background: var(--iaie-bg-muted);
    }

    .metric .k {
      color: var(--iaie-text-3);
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
    }

    .metric .v {
      margin-top: 4px;
      color: var(--iaie-text-1);
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    pre {
      overflow: auto;
      max-height: 540px;
      margin: 0;
      border-radius: 12px;
      padding: 16px;
      background: var(--code-bg);
      color: var(--code-text);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .log {
      min-height: 320px;
    }

    .note {
      color: var(--iaie-text-3);
      font-size: 13px;
      line-height: 20px;
      margin-top: 12px;
    }

    code {
      color: var(--iaie-color-primary);
      background: var(--iaie-bg-primary-soft);
      border-radius: 6px;
      padding: 1px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .task-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .task-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      width: 100%;
      min-height: auto;
      border: 1px solid var(--iaie-border-default);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      color: var(--iaie-text-1);
      text-align: left;
      font-weight: 400;
      box-shadow: none;
    }

    .task-item:hover,
    .task-item.selected {
      border-color: rgba(85, 90, 255, 0.38);
      background: var(--iaie-bg-primary-soft);
      transform: none;
      box-shadow: none;
    }

    .task-main {
      min-width: 0;
    }

    .task-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .task-query {
      margin-top: 4px;
      color: var(--iaie-text-3);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-side {
      display: grid;
      gap: 4px;
      justify-items: end;
      color: var(--iaie-text-3);
      font-size: 12px;
      white-space: nowrap;
    }

    .section-label {
      margin: 20px 0 8px;
      color: var(--iaie-text-2);
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
    }

    .helper-card {
      border: 1px solid var(--iaie-border-default);
      border-radius: 12px;
      padding: 12px;
      background: var(--iaie-bg-muted);
    }

    .toolbar-caption {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 0 10px;
      background: var(--iaie-bg-muted);
      color: var(--iaie-text-3);
      font-size: 12px;
      line-height: 20px;
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(100% - 32px, 1200px);
      }

      .layout,
      .result-grid,
      .grid2,
      .actions {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 0;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .panel-head,
      .panel-body {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">InnoSpark</div>
        <div>
          <div class="eyebrow">Web Search API Console</div>
          <h1>检索接口测试台</h1>
          <div class="subtitle">用于验证健康检查、同步调用、流式输出与异步任务轮询。</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="toolbar-caption">Local QA</span>
        <span id="serverBadge" class="badge">未检查服务</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="layout">
      <section>
        <div class="panel-head">
          <div>
            <h2>请求配置</h2>
            <p class="panel-desc">填入 API 地址、调用密钥和检索问题后即可发起测试。</p>
          </div>
          <span class="badge info">Ready</span>
        </div>
        <div class="panel-body">
          <div class="field-group">
            <div class="field">
              <label for="baseUrl">Base URL</label>
              <input id="baseUrl" value="" aria-label="API Base URL">
            </div>

            <div class="field">
              <label for="apiKey">API Key</label>
              <input id="apiKey" value="sk-your-api-key" aria-label="API Key">
            </div>

            <div class="field">
              <label for="query">查询问题</label>
              <textarea id="query" aria-label="查询问题">检索中国土地财政 2021 年土地出让收入 房产税改革 官方数据</textarea>
            </div>

            <div class="grid2">
              <div class="field">
                <label for="topN">top_n</label>
                <input id="topN" type="number" min="1" max="200" value="5">
              </div>
              <div class="field">
                <label for="taskId">异步 task_id</label>
                <input id="taskId" placeholder="创建任务后自动填入">
              </div>
            </div>
          </div>

          <div class="actions" aria-label="测试动作">
            <button id="healthBtn" class="secondary">健康检查</button>
            <button id="syncBtn">同步请求</button>
            <button id="streamBtn" class="secondary">流式请求</button>
            <button id="asyncBtn">创建异步任务</button>
            <button id="pollBtn" class="secondary">查询任务</button>
            <button id="pollAllBtn" class="secondary">查询全部任务</button>
            <button id="historyBtn" class="secondary">查询历史</button>
            <button id="autoPollBtn" class="secondary">自动轮询</button>
          </div>

          <div class="section-label">异步任务列表</div>
          <div id="taskList" class="task-list">
            <div class="note helper-card">还没有创建任务。</div>
          </div>

          <div class="note helper-card">
            如果通过 <code>/test-ui</code> 打开，本页面与 API 同源，不需要额外配置 CORS。
          </div>
        </div>
      </section>

      <section>
        <div class="panel-head">
          <div>
            <h2>响应结果</h2>
            <p class="panel-desc">实时展示接口状态、结果数量、耗时和原始响应体。</p>
          </div>
          <span class="toolbar-caption">JSON / SSE</span>
        </div>
        <div class="panel-body">
          <div class="status-row">
            <span id="authBadge" class="badge">鉴权未测</span>
            <span id="syncBadge" class="badge">同步未测</span>
            <span id="streamBadge" class="badge">流式未测</span>
            <span id="asyncBadge" class="badge">异步未测</span>
          </div>

          <div class="result-grid">
            <div class="metric">
              <div class="k">HTTP / 状态</div>
              <div id="statusValue" class="v">-</div>
            </div>
            <div class="metric">
              <div class="k">结果数量</div>
              <div id="countValue" class="v">-</div>
            </div>
            <div class="metric">
              <div class="k">耗时</div>
              <div id="durationValue" class="v">-</div>
            </div>
          </div>

          <pre id="output" class="log">点击左侧按钮开始测试。</pre>
        </div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let pollingTimer = null;
    const taskRecords = new Map();

    $("baseUrl").value = window.location.origin || "http://127.0.0.1:8110";

    function apiBase() {
      return $("baseUrl").value.replace(/\/$/, "");
    }

    function headers() {
      return {
        "Authorization": `Bearer ${$("apiKey").value.trim()}`,
        "Content-Type": "application/json",
      };
    }

    function payload(stream = false) {
      const body = {
        model: "roma-web-search",
        messages: [{ role: "user", content: $("query").value.trim() }],
        top_n: Number($("topN").value || 5),
        stream,
      };
      if (stream) {
        body.stream_chunk_chars = 24;
        body.stream_chunk_delay_ms = 120;
      }
      return body;
    }

    function setBadge(id, text, type = "") {
      const node = $(id);
      node.textContent = text;
      node.className = `badge ${type}`.trim();
    }

    function setMetrics(status, count = "-", duration = "-") {
      $("statusValue").textContent = status;
      $("countValue").textContent = String(count);
      $("durationValue").textContent = String(duration);
    }

    function writeOutput(value) {
      if (typeof value === "string") {
        $("output").textContent = value;
        $("output").scrollTop = $("output").scrollHeight;
        return;
      }
      $("output").textContent = JSON.stringify(value, null, 2);
      $("output").scrollTop = $("output").scrollHeight;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function shortTaskId(taskId) {
      return taskId ? `${taskId.slice(0, 8)}...${taskId.slice(-6)}` : "-";
    }

    function badgeTypeForStatus(status) {
      if (status === "completed") return "good";
      if (status === "failed") return "bad";
      if (status === "running" || status === "pending") return "warn";
      return "";
    }

    function rememberTask(data, fallbackQuestion = "") {
      if (!data?.task_id) return;
      const previous = taskRecords.get(data.task_id) || {};
      taskRecords.set(data.task_id, {
        task_id: data.task_id,
        status: data.status || previous.status || "unknown",
        created_at: data.created_at || previous.created_at || "",
        updated_at: data.updated_at || previous.updated_at || "",
        question: data.session?.question || previous.question || fallbackQuestion || $("query").value.trim(),
        result_count: data.statistics?.result_count ?? previous.result_count ?? "-",
        duration_ms: data.statistics?.duration_ms ?? previous.duration_ms ?? "-",
        artifact_markdown_path: data.result?.artifact_markdown_path || previous.artifact_markdown_path || "",
        artifact_json_path: data.result?.artifact_json_path || previous.artifact_json_path || "",
        artifact_record_id: data.result?.artifact_record_id || previous.artifact_record_id || "",
      });
      renderTaskList();
    }

    function renderTaskList() {
      const selected = $("taskId").value.trim();
      const records = Array.from(taskRecords.values()).reverse();
      if (!records.length) {
        $("taskList").innerHTML = '<div class="note">还没有创建任务。</div>';
        return;
      }

      $("taskList").innerHTML = records.map((record) => {
        const statusType = badgeTypeForStatus(record.status);
        const active = record.task_id === selected ? " selected" : "";
        const count = record.result_count === "-" ? "-" : `${record.result_count} 条`;
        const duration = record.duration_ms === "-" ? "-" : `${record.duration_ms} ms`;
        return `
          <button type="button" class="task-item${active}" data-task-id="${escapeHtml(record.task_id)}">
            <span class="task-main">
              <span class="task-id">${escapeHtml(shortTaskId(record.task_id))}</span>
              <span class="task-query">${escapeHtml(record.question || "(无查询文本)")}</span>
            </span>
            <span class="task-side">
              <span class="badge ${statusType}">${escapeHtml(record.status)}</span>
              <span>${escapeHtml(count)} / ${escapeHtml(duration)}</span>
            </span>
          </button>
        `;
      }).join("");
    }

    function setBusy(isBusy) {
      for (const btn of document.querySelectorAll("button")) {
        btn.disabled = isBusy;
      }
    }

    async function readJsonResponse(resp) {
      const text = await resp.text();
      try {
        return JSON.parse(text);
      } catch {
        return { raw: text };
      }
    }

    async function healthCheck() {
      setBusy(true);
      try {
        const resp = await fetch(`${apiBase()}/healthz`);
        const data = await readJsonResponse(resp);
        writeOutput(data);
        setMetrics(resp.status, "-", "-");
        setBadge("serverBadge", resp.ok ? "服务正常" : "服务异常", resp.ok ? "good" : "bad");
      } catch (err) {
        writeOutput(String(err));
        setBadge("serverBadge", "服务不可达", "bad");
      } finally {
        setBusy(false);
      }
    }

    async function syncRequest() {
      setBusy(true);
      const start = performance.now();
      try {
        const resp = await fetch(`${apiBase()}/web-search/v1/chat/completions`, {
          method: "POST",
          headers: headers(),
          body: JSON.stringify(payload(false)),
        });
        const data = await readJsonResponse(resp);
        const resultCount = data.roma_result?.contexts?.length ?? "-";
        const duration = data.roma_result?.debug?.duration_ms ?? `${Math.round(performance.now() - start)} ms`;
        writeOutput(data);
        setMetrics(resp.status, resultCount, duration);
        setBadge("authBadge", resp.status === 401 ? "鉴权失败" : "鉴权通过", resp.status === 401 ? "bad" : "good");
        setBadge("syncBadge", resp.ok && data.choices ? "同步通过" : "同步失败", resp.ok && data.choices ? "good" : "bad");
      } catch (err) {
        writeOutput(String(err));
        setBadge("syncBadge", "同步异常", "bad");
      } finally {
        setBusy(false);
      }
    }

    async function streamRequest() {
      setBusy(true);
      const chunks = [];
      const start = performance.now();
      try {
        const resp = await fetch(`${apiBase()}/web-search/v1/chat/completions`, {
          method: "POST",
          headers: headers(),
          body: JSON.stringify(payload(true)),
        });

        if (!resp.ok || !resp.body) {
          const data = await readJsonResponse(resp);
          writeOutput(data);
          setBadge("streamBadge", "流式失败", "bad");
          setMetrics(resp.status, "-", `${Math.round(performance.now() - start)} ms`);
          return;
        }

        setBadge("streamBadge", "SSE 已连接，检索中", "warn");
        writeOutput("SSE 连接已建立，正在等待底层检索结果...\n\n收到正文 chunk 后会逐段追加在这里。");

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let finalText = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const event of events) {
            const line = event.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;
            const dataText = line.slice(6).trim();
            if (dataText === "[DONE]") {
              chunks.push("[DONE]");
              continue;
            }
            const json = JSON.parse(dataText);
            const piece = json.choices?.[0]?.delta?.content || "";
            chunks.push(json);
            if (!piece) {
              if (!finalText) {
                writeOutput(`SSE 已连接，已收到 ${chunks.length} 个控制 chunk。\n\n正在等待检索正文...`);
              }
              continue;
            }
            finalText += piece;
            writeOutput(finalText);
            await sleep(35);
          }
        }

        setMetrics(resp.status, `${chunks.length} chunks`, `${Math.round(performance.now() - start)} ms`);
        setBadge("streamBadge", chunks.length ? "流式通过" : "流式无内容", chunks.length ? "good" : "warn");
      } catch (err) {
        writeOutput(String(err));
        setBadge("streamBadge", "流式异常", "bad");
      } finally {
        setBusy(false);
      }
    }

    async function createTask() {
      setBusy(true);
      try {
        const resp = await fetch(`${apiBase()}/web-search/v1/create_task`, {
          method: "POST",
          headers: headers(),
          body: JSON.stringify(payload(false)),
        });
        const data = await readJsonResponse(resp);
        if (data.data?.task_id) {
          $("taskId").value = data.data.task_id;
          rememberTask(data.data, $("query").value.trim());
        }
        writeOutput(data);
        setMetrics(resp.status, data.data?.status || "-", "-");
        setBadge("asyncBadge", resp.ok && data.data?.task_id ? "任务已创建" : "创建失败", resp.ok && data.data?.task_id ? "good" : "bad");
      } catch (err) {
        writeOutput(String(err));
        setBadge("asyncBadge", "创建异常", "bad");
      } finally {
        setBusy(false);
      }
    }

    async function pollOneTask(taskId, silent = false) {
      if (!taskId) {
        writeOutput("请先创建异步任务，或手动填入 task_id。");
        setBadge("asyncBadge", "缺少 task_id", "warn");
        return null;
      }

      if (!silent) setBusy(true);
      try {
        const url = new URL(`${apiBase()}/web-search/v1/query_task`);
        url.searchParams.set("task_id", taskId);
        const resp = await fetch(url, { headers: { "Authorization": `Bearer ${$("apiKey").value.trim()}` } });
        const data = await readJsonResponse(resp);
        const status = data.data?.status || resp.status;
        const resultCount = data.data?.statistics?.result_count ?? "-";
        const duration = data.data?.statistics?.duration_ms ?? "-";
        if (data.data?.task_id) {
          rememberTask(data.data);
        }
        writeOutput(data);
        setMetrics(status, resultCount, duration);
        setBadge("asyncBadge", status === "completed" ? "异步完成" : `异步 ${status}`, status === "failed" ? "bad" : status === "completed" ? "good" : "warn");
        return data;
      } catch (err) {
        writeOutput(String(err));
        setBadge("asyncBadge", "查询异常", "bad");
        return null;
      } finally {
        if (!silent) setBusy(false);
      }
    }

    async function pollTask(silent = false) {
      let taskId = $("taskId").value.trim();
      if (!taskId && taskRecords.size) {
        taskId = Array.from(taskRecords.keys()).at(-1);
        $("taskId").value = taskId;
      }
      return pollOneTask(taskId, silent);
    }

    async function pollAllTasks(silent = false) {
      const ids = Array.from(taskRecords.keys());
      if (!ids.length) {
        return pollTask(silent);
      }

      if (!silent) setBusy(true);
      try {
        const results = [];
        for (const taskId of ids) {
          const data = await pollOneTask(taskId, true);
          if (data) results.push(data.data || data);
        }
        writeOutput({
          count: results.length,
          tasks: results.map((item) => ({
            task_id: item.task_id,
            status: item.status,
            result_count: item.statistics?.result_count ?? "-",
            duration_ms: item.statistics?.duration_ms ?? "-",
            artifact_markdown_path: item.result?.artifact_markdown_path || "",
            artifact_record_id: item.result?.artifact_record_id || "",
          })),
        });
        const done = results.filter((item) => item.status === "completed").length;
        const failed = results.filter((item) => item.status === "failed").length;
        setMetrics(`${done}/${results.length} completed`, `${failed} failed`, "-");
        setBadge("asyncBadge", `已查询 ${results.length} 个任务`, failed ? "bad" : done === results.length ? "good" : "warn");
        return results;
      } finally {
        if (!silent) setBusy(false);
      }
    }

    async function autoPoll() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
        setBadge("asyncBadge", "已停止轮询", "warn");
        return;
      }

      setBadge("asyncBadge", "自动轮询中", "warn");
      pollingTimer = setInterval(async () => {
        const results = await pollAllTasks(true);
        const records = Array.isArray(results) ? results : [results?.data].filter(Boolean);
        const allFinished = records.length > 0 && records.every((item) => item.status === "completed" || item.status === "failed");
        if (allFinished) {
          clearInterval(pollingTimer);
          pollingTimer = null;
        }
      }, 2500);
      await pollAllTasks(true);
    }

    async function queryHistory() {
      setBusy(true);
      try {
        const url = new URL(`${apiBase()}/web-search/v1/history`);
        url.searchParams.set("limit", "20");
        url.searchParams.set("offset", "0");
        const resp = await fetch(url, { headers: { "Authorization": `Bearer ${$("apiKey").value.trim()}` } });
        const data = await readJsonResponse(resp);
        writeOutput(data);
        const total = data.data?.total ?? "-";
        const records = data.data?.records?.length ?? "-";
        setMetrics(resp.status, `${records}/${total}`, "-");
        setBadge("asyncBadge", resp.ok ? `历史 ${records}/${total}` : "历史失败", resp.ok ? "good" : "bad");
      } catch (err) {
        writeOutput(String(err));
        setBadge("asyncBadge", "历史异常", "bad");
      } finally {
        setBusy(false);
      }
    }

    $("taskList").addEventListener("click", (event) => {
      const item = event.target.closest("[data-task-id]");
      if (!item) return;
      $("taskId").value = item.dataset.taskId;
      renderTaskList();
    });

    $("healthBtn").addEventListener("click", healthCheck);
    $("syncBtn").addEventListener("click", syncRequest);
    $("streamBtn").addEventListener("click", streamRequest);
    $("asyncBtn").addEventListener("click", createTask);
    $("pollBtn").addEventListener("click", () => pollTask(false));
    $("pollAllBtn").addEventListener("click", () => pollAllTasks(false));
    $("historyBtn").addEventListener("click", queryHistory);
    $("autoPollBtn").addEventListener("click", autoPoll);

    healthCheck();
  </script>
</body>
</html>
